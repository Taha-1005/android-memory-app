name: EAS Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "EAS Update branch (matches the channel baked into the installed APK)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

concurrency:
  group: eas-update-${{ github.event.inputs.branch || 'preview' }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_TOKEN is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --ci

      - name: Publish update
        env:
          EAS_BRANCH: ${{ github.event.inputs.branch || 'preview' }}
          # Pass the commit message via env so bash never re-parses it.
          # Direct ${{ }} interpolation pastes raw text into the shell script,
          # which blows up on backticks, parens, $, and other punctuation that
          # legitimately appears in commit bodies.
          EAS_MESSAGE: ${{ github.event.head_commit.message || format('Manual dispatch from {0}', github.sha) }}
        run: eas update --branch "$EAS_BRANCH" --message "$EAS_MESSAGE" --non-interactive
